services:
  server:
    build:
      context: ./app
      # target: production
      target: development
    restart: always
    env_file:
      - ./app/config/.env
    environment:
      HOST_NAME: db
      DB_NAME: sistema_financeiro
      DB_USERNAME: root
      DB_PASSWORD: "1234"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    develop:
      watch:
        - action: sync
          path: ./app/src
          target: /var/www/src

  db:
    image: mysql:8.4.8
    restart: always
    environment:
      TZ: "America/Sao_Paulo"
      MYSQL_ROOT_PASSWORD: "1234"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysqldata:/var/lib/mysql
      - ./app/config/database:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"

volumes:
  mysqldata: